# deploy/deploy.conf: the only per-project deploy file (see DEPLOY-RULES.md in the infra repo).
NAME=goliath
DOMAIN=api.goliath.c7d5a6.com
PORT=3010
START=./goliath-backend
HEALTH=/healthz
# .env holds config; data/ holds goliath.db and goliath-firebase.json and survives releases.
SHARED=(.env data/)
build() {
	CGO_ENABLED=0 GOOS=linux GOARCH=$GOARCH go build -trimpath -ldflags='-s -w' \
		-o "$OUT/goliath-backend" .
	cp -r migrations "$OUT/migrations"
}
